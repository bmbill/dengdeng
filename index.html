<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- interactive-widget=resizes-content：Android Chrome 會在鍵盤彈出時
       把 layout viewport 一起縮小，固定定位的彈層才不會被壓在鍵盤底下。
       iOS 不支援這個，那邊靠 ui.js 的 visualViewport 處理。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#FAF6EC">
  <meta name="description" content="隨手記一則善行或觀功念恩，一天點一盞燈。大家的燈飄在同一片夜空。">
  <title>燈燈悅心</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="燈燈悅心">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <main id="app"></main>
  <nav id="tabbar" class="tabbar" aria-label="主要分頁"></nav>
  <script type="module" src="src/app.js"></script>
</body>
</html>
