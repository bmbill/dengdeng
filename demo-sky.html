<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>燈燈悅心 — 天空會長出什麼</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <style>
    /* 這一頁只是拿來看夜空長什麼樣子，不碰任何紀錄。 */
    body { padding: 28px 18px 60px; }
    .wrap { max-width: 460px; margin: 0 auto; }
    h1 { font-family: var(--serif); font-size: 1.4rem; color: var(--cinnabar-d); letter-spacing: .08em; }
    .lede { margin-top: 8px; font-size: .82rem; color: var(--muted); line-height: 1.9; }
    h2.part {
      margin-top: 38px; font-family: var(--serif); font-size: 1.1rem;
      letter-spacing: .06em; color: var(--ink);
      padding-bottom: 8px; border-bottom: 1px solid var(--line);
    }
    .part-note { margin-top: 8px; font-size: .78rem; color: var(--muted); line-height: 1.9; }
    .stage { margin-top: 26px; }
    .stage h3 { font-family: var(--serif); font-size: 1rem; letter-spacing: .06em; }
    .stage .what { margin-top: 4px; margin-bottom: 10px; font-size: .78rem; color: var(--muted); }
    .sea { min-height: 300px; }
    /* 預覽頁把「偶爾才出現」的東西定住。
       人、出家人、雁在 app 裡幾分鐘才走一趟，不定住的話這一頁多數時候
       看起來就是什麼都沒有。 */
    .freeze .sky-walker { animation: none; left: 26%; opacity: .92; }
    .freeze .sky-monk   { animation: none; right: 46%; opacity: .95; }
    .freeze .sky-monk svg { animation: none; }
    .freeze .sky-geese  { animation: none; left: 54%; opacity: .8; }
    .freeze .tower-lamp { animation: none; opacity: .9; }
    .cardshot { margin-top: 12px; }
    .cardshot img { width: 100%; border-radius: var(--r-l); box-shadow: var(--shadow); display: block; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>天空會長出什麼</h1>
  <p class="lede">
    這一頁用的是 app 本身的程式和樣式，不是示意圖。<br>
    動畫是真的在動：燈會飄、星星會閃。<br>
    人、出家人、雁在 app 裡幾分鐘才走一趟，這一頁把它們定住給你看。<br>
    <b>這一頁不會動到你的任何紀錄。</b>
  </p>
  <div id="out"></div>
</div>

<script type="module">
import { makeLamp } from './src/lamp.js';
import { sceneryHTML, stageClasses, SKY_STAGES, LIFE_STAGES, SCENES } from './src/sky.js';
import { layoutOf, paint, reflect, startWind } from './src/views/sea.js';
import { makeSkyCard } from './src/share.js';

/** 造一批假的燈，只存在記憶體裡。 */
function fakeLamps(n, salt = 'demo') {
  const out = [];
  for (let i = n; i >= 1; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const date = d.toISOString().slice(0, 10);
    const day = {
      date,
      deeds: 1,
      gratitude: i % 2 === 0 ? 1 : 0,
      sutras: i % 3 === 0 ? 1 : 0,
      notes: 0,
      pages: i % 3 === 0 ? 6 + (i * 3) % 18 : 0,
      total: 1 + (i % 2 === 0 ? 1 : 0) + (i % 3 === 0 ? 1 : 0),
      joys: i % 5 === 0 ? 4 : 0,
      kinds: 1 + (i % 2 === 0 ? 1 : 0) + (i % 3 === 0 ? 1 : 0),
    };
    out.push({
      key: `${salt}-${date}`,
      lamp: makeLamp(day, { streak: n - i + 1, seedSalt: `${salt}${i % 9}` }),
      joys: day.joys,
    });
  }
  return out;
}

/** 一片天空。filled 管這一片，reached 管這個群一共供過幾盞。 */
function sky({ filled, reached = filled, skyNo = 1, foot = '' }) {
  const lamps = fakeLamps(Math.min(filled, 108), `s${skyNo}`);
  const spots = layoutOf(lamps, { avoidMoon: filled >= 108 });
  const isLake = SCENES[(skyNo - 1) % SCENES.length].key === 'lake';
  return `
    <div class="sea freeze ${stageClasses({ filled, reached, skyNo })}">
      ${sceneryHTML({ filled, reached, skyNo })}
      ${isLake ? `<div class="sky-reflect" aria-hidden="true">${reflect(spots)}</div>` : ''}
      ${paint(spots)}
      ${foot ? `<div class="sea-foot"><div class="grow"><div class="t">${foot}</div></div></div>` : ''}
    </div>
  `;
}

const parts = [];

parts.push(`<h2 class="part">這一片填了幾盞</h2>
  <p class="part-note">每一片天空都從空走到滿，所以這幾樣會重來一次。<br>
  一片上限 108 盞，月亮是滿的那一刻才出現的。</p>`);

for (const m of SKY_STAGES) {
  parts.push(`<section class="stage">
    <h3>${m.at} 盞</h3>
    <div class="what">${m.label}</div>
    ${sky({ filled: m.at, foot: `這片天空 ${m.at} 盞` })}
  </section>`);
}

parts.push(`<h2 class="part">這個群一共供過幾盞</h2>
  <p class="part-note">不會因為換了新的一片而清空。下面每一張都當作這一片已經滿了（108 盞），
  差別只在這個群走了多遠。</p>`);

for (const m of LIFE_STAGES) {
  parts.push(`<section class="stage">
    <h3>累計 ${m.at} 盞</h3>
    <div class="what">${m.label}</div>
    ${sky({ filled: 108, reached: m.at, foot: `第 ${Math.ceil(m.at / 108)} 片 · 累計 ${m.at} 盞` })}
  </section>`);
}

parts.push(`<h2 class="part">三種底，一片換一種</h2>
  <p class="part-note">第 1 片夜空、第 2 片湖面、第 3 片山谷，之後循環。
  湖面那片的燈在水裡有倒影。下面都是滿的 108 盞、累計 540。</p>`);

SCENES.forEach((sc, i) => {
  parts.push(`<section class="stage">
    <h3>第 ${i + 1} 片 · ${sc.name}</h3>
    <div class="what">滿了 108 盞</div>
    ${sky({ filled: 108, reached: 540, skyNo: i + 1, foot: `這片天空滿了 · 108 盞` })}
    <div class="cardshot"><button class="btn sm" data-card="${i + 1}">看這片的分享圖卡</button></div>
  </section>`);
});

const out = document.getElementById('out');
out.innerHTML = parts.join('');

out.querySelectorAll('[data-card]').forEach((b) => {
  b.addEventListener('click', async () => {
    const skyNo = Number(b.dataset.card);
    b.disabled = true;
    b.textContent = '正在畫…';
    const lamps = fakeLamps(108, `s${skyNo}`);
    const blob = await makeSkyCard({
      info: {
        skyNo, size: 108, filled: 108, isFull: true, totalSkies: 3,
        authors: 17, entries: 214, pages: 860,
        fromDay: '2026-09-01', toDay: '2026-09-15',
      },
      spots: layoutOf(lamps, { avoidMoon: true }),
      reached: 540,
      groupName: '週三共學',
    });
    const img = new Image();
    img.src = URL.createObjectURL(blob);
    b.parentElement.appendChild(img);
    b.remove();
  });
});

// 風向會轉，所有天空一起轉
startWind();
</script>
</body>
</html>
